name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ios_only:
        description: "Build only the unsigned iOS IPA (skips Android/desktop and the release)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Build signed Android APK
  build-android:
    # Signing secrets only exist on the upstream repo; a fork builds the rest.
    if: ${{ !inputs.ios_only && secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/keystore.jks

      # Only the githubFull flavor is published: in-app self-update installs the first .apk
      # asset of the latest release, and the fdroid flavor has neither self-update nor ML.
      - name: Build signed APK
        run: ./gradlew :androidApp:assembleGithubFullRelease
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/keystore.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # Without a usable RELEASE_KEYSTORE, AGP emits androidApp-githubFull-release-unsigned.apk
      # instead, so this cp fails rather than publishing an APK that breaks update signature continuity.
      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp androidApp/build/outputs/apk/githubFull/release/androidApp-githubFull-release.apk \
            "CivitDeck-${VERSION}-android.apk"

      - name: Generate SHA-256 checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sha256sum "CivitDeck-${VERSION}-android.apk" > "CivitDeck-${VERSION}-android.apk.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            CivitDeck-*-android.apk
            CivitDeck-*-android.apk.sha256

  # Build macOS DMG
  build-macos:
    if: ${{ !inputs.ios_only }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Build DMG
        run: ./gradlew :desktopApp:packageDmg

      - name: Rename DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG=$(find desktopApp/build/compose/binaries -name "*.dmg" | head -1)
          cp "$DMG" "CivitDeck-${VERSION}-macos.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: CivitDeck-*-macos.dmg

  # Build Windows MSI
  build-windows:
    if: ${{ !inputs.ios_only }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build MSI
        run: ./gradlew :desktopApp:packageMsi

      - name: Rename MSI
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MSI=$(find desktopApp/build/compose/binaries -name "*.msi" | head -1)
          cp "$MSI" "CivitDeck-${VERSION}-windows.msi"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: CivitDeck-*-windows.msi

  # Build Linux DEB
  build-linux:
    if: ${{ !inputs.ios_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DEB
        run: ./gradlew :desktopApp:packageDeb

      - name: Rename DEB
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DEB=$(find desktopApp/build/compose/binaries -name "*.deb" | head -1)
          cp "$DEB" "CivitDeck-${VERSION}-linux.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: CivitDeck-*-linux.deb

  # Build unsigned iOS IPA (device build, no Apple account/certs).
  # The app links the static Kotlin/Native Shared.framework, which the project's
  # "Compile Kotlin Framework" build phase produces via
  # `./gradlew :shared:embedAndSignAppleFrameworkForXcode`.
  build-ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # App code uses Swift 6.1+ syntax, so it needs Xcode 26 (Swift 6.2).
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Info.plist hardcodes 2.5/10, which would make every release the same
      # bundle version - SideStore then refuses the update as already installed.
      - name: Stamp version into Info.plist
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.$GITHUB_RUN_NUMBER"; fi
          plutil -replace CFBundleShortVersionString -string "$VERSION" iosApp/iosApp/Info.plist
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" iosApp/iosApp/Info.plist

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/DerivedData"
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/DerivedData"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.$GITHUB_RUN_NUMBER"; fi
          APP=$(find "$DERIVED/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          [ -n "$APP" ] || { echo '::error::no .app produced - refusing to package an empty IPA'; exit 1; }
          STAGE="$RUNNER_TEMP/ipa"; rm -rf "$STAGE"; mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          # Strip anything signable so SideStore/AltStore start from a clean bundle.
          rm -rf "$STAGE/Payload/"*.app/_CodeSignature
          rm -f  "$STAGE/Payload/"*.app/embedded.mobileprovision
          IPA="CivitDeck-${VERSION}-ios-unsigned.ipa"
          ( cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/$IPA" Payload )
          # A stub IPA is a structurally valid zip with an empty Payload/ - guard it.
          LISTING=$(unzip -l "$IPA")
          case "$LISTING" in
            *Payload/*.app/*) ;;
            *) echo '::error::Payload has no .app - refusing to upload'; exit 1 ;;
          esac
          echo "IPA size: $(wc -c < "$IPA") bytes"
          shasum -a 256 "$IPA" > "$IPA.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            CivitDeck-*-ios-unsigned.ipa
            CivitDeck-*-ios-unsigned.ipa.sha256

  # Create GitHub Release with all artifacts
  create-release:
    # always(): a skipped dependency (e.g. Android without signing secrets) would
    # otherwise skip the release too. Publish only if the iOS artifact exists.
    if: ${{ always() && github.event_name != 'workflow_dispatch' && needs.build-ios.result == 'success' }}
    runs-on: ubuntu-latest
    needs: [build-android, build-macos, build-windows, build-linux, build-ios]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract text between this version header and the next version header
          NOTES=$(sed -n "/^## \[${VERSION}\]/,/^## \[/{ /^## \[${VERSION}\]/d; /^## \[/d; p; }" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${VERSION}"
          fi
          # Write to file to preserve formatting
          echo "$NOTES" > release_notes.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "CivitDeck ${GITHUB_REF_NAME#v}" \
            --notes-file release_notes.txt \
            --latest \
            artifacts/*